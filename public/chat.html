<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }

    /* Join screen */
    .join-screen { flex: 1; display: flex; align-items: center; justify-content: center; }
    .join-box { background: #1e293b; padding: 32px; border-radius: 16px; width: 360px; text-align: center; }
    .join-box h2 { margin-bottom: 8px; font-size: 22px; }
    .join-box .room-name { color: #3b82f6; font-size: 14px; margin-bottom: 24px; }
    .join-box input { width: 100%; padding: 12px 16px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 16px; outline: none; margin-bottom: 16px; }
    .join-box input:focus { border-color: #3b82f6; }
    .join-box button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; }
    .join-box button:hover { background: #2563eb; }

    /* Chat screen */
    .chat-screen { flex: 1; display: none; flex-direction: column; }
    .chat-header { padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 10px; }
    .chat-header .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .chat-header .dot.connected { background: #22c55e; }
    .chat-header .room-label { font-weight: 600; font-size: 16px; }
    .chat-header .user-label { color: #94a3b8; font-size: 13px; margin-left: auto; }

    .messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; }
    .msg { max-width: 65%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
    .msg .meta { font-size: 11px; color: #94a3b8; margin-top: 3px; }
    .msg.sent { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
    .msg.sent .meta { color: #bfdbfe; }
    .msg.received { align-self: flex-start; background: #334155; border-bottom-left-radius: 4px; }
    .msg.received .sender { font-size: 12px; font-weight: 600; color: #60a5fa; margin-bottom: 2px; }
    .system-msg { text-align: center; font-size: 12px; color: #64748b; padding: 4px; }

    .input-area { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid #334155; background: #1e293b; }
    .input-area input { flex: 1; padding: 12px 16px; border: 1px solid #475569; border-radius: 10px; background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none; }
    .input-area input:focus { border-color: #3b82f6; }
    .input-area button { padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 600; }
    .input-area button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <!-- Join screen -->
  <div class="join-screen" id="join-screen">
    <div class="join-box">
      <h2>Join Chat</h2>
      <div class="room-name" id="room-display"></div>
      <input id="name-input" placeholder="Your name..." autocomplete="off" autofocus>
      <button onclick="joinChat()">Join</button>
    </div>
  </div>

  <!-- Chat screen -->
  <div class="chat-screen" id="chat-screen">
    <div class="chat-header">
      <div class="dot" id="status-dot"></div>
      <span class="room-label" id="room-label"></span>
      <span class="user-label" id="user-label"></span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input id="msg-input" placeholder="Type a message..." autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const roomId = pathParts[pathParts.length - 1] || "general";
    let username = "";
    const seen = new Set();

    document.getElementById("room-display").textContent = `Room: ${roomId}`;

    document.getElementById("name-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") joinChat();
    });

    function joinChat() {
      const name = document.getElementById("name-input").value.trim();
      if (!name) return;
      username = name;

      document.getElementById("join-screen").style.display = "none";
      document.getElementById("chat-screen").style.display = "flex";
      document.getElementById("room-label").textContent = `# ${roomId}`;
      document.getElementById("user-label").textContent = username;

      connectSSE();
      document.getElementById("msg-input").focus();
    }

    function escapeHtml(text) {
      const d = document.createElement("div");
      d.textContent = text;
      return d.innerHTML;
    }

    function addMessage(msg) {
      if (seen.has(msg.id)) return;
      seen.add(msg.id);

      const container = document.getElementById("messages");
      const div = document.createElement("div");
      const isMine = msg.from === username;
      div.className = `msg ${isMine ? "sent" : "received"}`;

      const time = new Date(msg.sentAt).toLocaleTimeString("vi-VN");
      let html = "";
      if (!isMine) {
        html += `<div class="sender">${escapeHtml(msg.from)}</div>`;
      }
      html += `${escapeHtml(msg.text)}<div class="meta">${time}</div>`;
      div.innerHTML = html;

      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function addSystemMsg(text) {
      const container = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "system-msg";
      div.textContent = text;
      container.appendChild(div);
    }

    function connectSSE() {
      const es = new EventSource(`/api/chat/stream/${roomId}`);

      es.addEventListener("connected", () => {
        document.getElementById("status-dot").classList.add("connected");
        addSystemMsg(`${username} joined the room`);
      });

      es.addEventListener("message", (e) => {
        const msg = JSON.parse(e.data);
        addMessage(msg);
      });

      es.onerror = () => {
        document.getElementById("status-dot").classList.remove("connected");
        addSystemMsg("Disconnected, reconnecting...");
      };
    }

    async function sendMessage() {
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      await fetch("/api/chat/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ roomId, from: username, text }),
      });
    }

    document.getElementById("msg-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
