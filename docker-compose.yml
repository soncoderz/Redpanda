name: appointment-backend

networks:
  backend:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  redpanda-data:
  restate-data:

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend

  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.6
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --set redpanda.superusers=["admin"]
      - --set redpanda.enable_sasl=true
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - backend

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.7.2
    restart: unless-stopped
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
          sasl:
            enabled: true
            mechanism: SCRAM-SHA-256
            username: admin
            password: admin-secret
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
        kafkaConnect:
          enabled: true
          clusters:
            - name: local
              url: http://kafka-connect:8083
    ports:
      - "8081:8080"
    depends_on:
      - redpanda-0
    networks:
      - backend

  kafka-connect:
    build: ./connectors
    restart: unless-stopped
    hostname: kafka-connect
    environment:
      CONNECT_BOOTSTRAP_SERVERS: redpanda-0:9092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: appointment-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_SASL_MECHANISM: SCRAM-SHA-256
      CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka-connect" password="connect-secret";'
      CONNECT_CONSUMER_SASL_MECHANISM: SCRAM-SHA-256
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka-connect" password="connect-secret";'
      CONNECT_PRODUCER_SASL_MECHANISM: SCRAM-SHA-256
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka-connect" password="connect-secret";'
    ports:
      - "8083:8083"
    depends_on:
      - redpanda-0
      - mongo
    networks:
      - backend

  restate:
    image: docker.restate.dev/restatedev/restate:latest
    restart: unless-stopped
    command:
      - --node-name=restate-1
    ports:
      - "18080:8080"
      - "19070:9070"
      - "15122:5122"
    volumes:
      - restate-data:/restate-data
    networks:
      - backend

  api:
    build: .
    restart: unless-stopped
    environment: &app-env
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 9080
      PUBLIC_RESTATE_ENDPOINT: http://api:9080/restate
      RESTATE_RUNTIME_URL: http://restate:8080
      RESTATE_ADMIN_URL: http://restate:9070
      MONGODB_URI: mongodb://mongo:27017/appointments
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda-0:9092
      SCHEMA_REGISTRY_URL: http://redpanda-0:8081
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      KAFKA_APPOINTMENT_TOPIC: appointment-events
      KAFKA_TOPIC_REPLICATION_FACTOR: 1
      QUEUE_DASHBOARD_PATH: /admin/queues
    ports:
      - "9080:9080"
    depends_on:
      - mongo
      - redis
      - redpanda-0
      - restate
    networks:
      - backend

  restate-register:
    build: .
    restart: "no"
    command: ["node", "dist/scripts/register-restate.js"]
    environment:
      <<: *app-env
    depends_on:
      - api
      - restate
    networks:
      - backend

  email-worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/workers/email.worker.js"]
    environment:
      <<: *app-env
    depends_on:
      - api
      - redis
      - restate
    networks:
      - backend

  maintenance-worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/workers/maintenance.worker.js"]
    environment:
      <<: *app-env
    depends_on:
      - redis
    networks:
      - backend

